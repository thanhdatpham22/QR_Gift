<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thiệp 3D dành cho bạn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="card">
  <main class="scene card-scene">
    <div class="glow"></div>

    <section class="card3d" id="cardShell" aria-label="Thiệp 3D">
      <div class="card-outer" id="cardOuter">
        <div class="card-front">
          <div class="front-design">
            <span class="tag">For you</span>
            <h2>Open me</h2>
            <p>Chạm để mở thiệp</p>
            <div class="shine"></div>
          </div>
        </div>
        <div class="card-inner">
          <div class="letter">
            <p class="label">Lời chúc</p>
            <p id="letterText"></p>
            <div class="confetti"></div>
          </div>
        </div>
        <div class="spine"></div>
      </div>
      <button class="open-hint" id="hintBtn">Chạm vào thiệp để mở</button>
    </section>
  </main>

  <script src="main.js" type="module"></script>
</body>
</html>
